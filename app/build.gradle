plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.mahnet.sklad'
    compileSdk 34

    // Версия: номер сборки на GitHub увеличивается сам при каждом запуске,
    // поэтому каждая новая сборка устанавливается ПОВЕРХ старой как обновление.
    def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
    // Версия приложения 1.0.N: N = номер сборки на GitHub − «база» − 1. Поэтому первая сборка после сброса — 1.0.0,
    // следующие — 1.0.1, 1.0.2… «База» — число в app/version-base.txt. Если там слово auto (или пусто), сборка на GitHub
    // сама запишет туда нужное число (шаг «Версия» в .github/workflows/build.yml) — счёт начнётся с 1.0.0.
    // versionCode (внутренний номер для Android) равен номеру сборки и только растёт, поэтому новая сборка ставится поверх старой.
    def envBase = System.getenv("VERSION_BASE")
    def baseFile = file("version-base.txt")
    def fileBase = (baseFile.exists() && baseFile.text.trim() ==~ /\d+/) ? baseFile.text.trim() : "0"
    def verBase = ((envBase != null && envBase.trim() ==~ /\d+/) ? envBase.trim() : fileBase).toInteger()
    def verN = Math.max(0, runNumber - verBase - 1)

    defaultConfig {
        applicationId "ru.mahnet.sklad"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + verN
    }

    // Постоянная подпись: один и тот же ключ для всех сборок (иначе Android не даёт обновить поверх).
    signingConfigs {
        market {
            storeFile file("sklad-release.p12")
            storeType "pkcs12"
            storePassword "market-sklad-2026"
            keyAlias "sklad"
            keyPassword "market-sklad-2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.market
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.market
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
